<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" role="img">
  <rect width="640" height="398" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Classes ATLS - hemorragia</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Perda volemica estimada (adulto ~70 kg)</text>
  <rect x="32" y="78" width="576" height="248" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe I - perda &lt;15% (~&lt;750 mL)</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">PA normal</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe II - 15-30% (~750-1500)</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">PA ok / FC+</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe III - 30-40% (~1500-2000)</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">PA cai</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe IV - &gt;40% (&gt;2000 mL)</text>
  <text x="580" y="172" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">Choque grave</text>
  <text x="48" y="200" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe I - fillip / anxiedade</text>
  <text x="580" y="200" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">Minima</text>
  <text x="48" y="228" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe II - sede, FC 100-120</text>
  <text x="580" y="228" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">DEB leve</text>
  <text x="48" y="256" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe III - confusao, oliguria</text>
  <text x="580" y="256" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">DEB claro</text>
  <text x="48" y="284" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Classe IV - letargia, FC &gt;140</text>
  <text x="580" y="284" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">DEB critico</text>
  <text x="32" y="340" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">I &lt;15% | II 15-30% | III 30-40% | IV &gt;40%</text>

</svg>
