<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" role="img">
  <rect width="640" height="306" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sinais de gravidade / ameaca a vida</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Crise asmatica</text>
  <circle cx="52" cy="92" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="96" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="76" y="96" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Fala entrecortada / ortopneia</text>
  <circle cx="52" cy="126" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="130" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="76" y="130" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">FR alta / uso de musculatura acessoria</text>
  <circle cx="52" cy="160" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="164" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="76" y="164" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">FC elevada / SpO2 &lt; 90-92%</text>
  <circle cx="52" cy="194" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="198" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="76" y="198" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">PFE &lt;= 50% (grave) ou &lt;= 33% (ameaca)</text>
  <circle cx="52" cy="228" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="232" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">5</text>
  <text x="76" y="232" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Silencio toracico / cianose / confusao</text>
  <text x="32" y="282" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Silencio toracico + confusao = ameaca a vida</text>

</svg>
