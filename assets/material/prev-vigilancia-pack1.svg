  <text x="322" y="150" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Busca intencional</text>
  <text x="322" y="170" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Surto / caso raro</text>
  <text x="322" y="190" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Mais cara e completa</text>
