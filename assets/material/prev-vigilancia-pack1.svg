  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Passiva / ativa / sentinela</text>
  <rect x="32" y="90" width="180" height="170" rx="14" fill="#14532d" stroke="#4ade80"/>
  <text x="122" y="120" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Passiva</text>
  <text x="122" y="150" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Notificacao rotina</text>
  <text x="122" y="170" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Servico informa</text>
  <text x="122" y="190" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Barata; subnotifica</text>
  <text x="122" y="230" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="12" font-weight="700">SINAN tipico</text>
  <rect x="232" y="90" width="180" height="170" rx="14" fill="#78350f" stroke="#fbbf24"/>
