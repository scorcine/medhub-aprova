<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img">
  <rect width="640" height="272" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Criterios de supra (STEMI)</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">ECG - elevacao de ST</text>
  <circle cx="52" cy="92" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="96" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="76" y="96" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Dor toracica / equivalente isquemico</text>
  <circle cx="52" cy="126" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="130" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="76" y="130" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Supra ST em &gt;= 2 derivacoes contiguas</text>
  <circle cx="52" cy="160" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="164" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="76" y="164" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Ou BRE novo / equivalente de supra</text>
  <circle cx="52" cy="194" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="198" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="76" y="198" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Tempo ate PCI ou fibrinolise</text>
  <text x="32" y="248" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Homens: V2-V3 &gt;= 2 mm (ou &gt;= 2,5 mm &lt;40a); mulheres V2-V3 &gt;= 1,5 mm; demais &gt;= 1 mm</text>

