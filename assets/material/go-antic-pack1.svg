<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img">
  <rect width="640" height="300" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">MEC - categorias (ideia)</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">1 seguro -&gt; 4 contraindicado</text>
  <rect x="32" y="90" width="180" height="170" rx="14" fill="#14532d" stroke="#4ade80"/>
  <text x="122" y="120" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Cat 1-2</text>
  <text x="122" y="150" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">1: sem restricao</text>
  <text x="122" y="170" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">2: vantagens &gt; riscos</text>
  <text x="122" y="190" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">usar com cuidado</text>
  <text x="122" y="230" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="12" font-weight="700">Pode usar</text>
  <rect x="232" y="90" width="180" height="170" rx="14" fill="#78350f" stroke="#fbbf24"/>
  <text x="322" y="120" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Cat 3</text>
  <text x="322" y="150" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Riscos &gt; vantagens</text>
  <text x="322" y="170" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">evitar se houver</text>
  <text x="322" y="190" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">alternativa melhor</text>
  <text x="322" y="230" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="700">Evitar</text>
  <rect x="432" y="90" width="180" height="170" rx="14" fill="#7f1d1d" stroke="#f87171"/>
  <text x="522" y="120" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Cat 4</text>
  <text x="522" y="150" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Risco inaceitavel</text>
  <text x="522" y="170" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">contraindicacao</text>
  <text x="522" y="190" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">absoluta pratica</text>
  <text x="522" y="230" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="700">Nao usar</text>

</svg>
