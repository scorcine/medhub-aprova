<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img">
  <rect width="640" height="300" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Gustilo-Anderson</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">I / II / III</text>
  <rect x="32" y="90" width="180" height="170" rx="14" fill="#14532d" stroke="#4ade80"/>
  <text x="122" y="120" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Tipo I</text>
  <text x="122" y="150" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Ferida &lt;1 cm</text>
  <text x="122" y="170" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Limpa, baixa energia</text>
  <text x="122" y="190" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">ATB + desbridamento</text>
  <text x="122" y="230" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="12" font-weight="700">Menor risco</text>
  <rect x="232" y="90" width="180" height="170" rx="14" fill="#78350f" stroke="#fbbf24"/>
  <text x="322" y="120" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Tipo II</text>
  <text x="322" y="150" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Ferida 1-10 cm</text>
  <text x="322" y="170" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Contusao moderada</text>
  <text x="322" y="190" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">ATB + limpeza</text>
  <text x="322" y="230" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="700">Intermediario</text>
  <rect x="432" y="90" width="180" height="170" rx="14" fill="#7f1d1d" stroke="#f87171"/>
  <text x="522" y="120" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Tipo III</text>
  <text x="522" y="150" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">&gt;10 cm / alta energia</text>
  <text x="522" y="170" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">IIIA/B/C (cobertura/vaso)</text>
  <text x="522" y="190" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">ATB amplo + ortopedia</text>
  <text x="522" y="230" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="700">Maior risco</text>

</svg>
