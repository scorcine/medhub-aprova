<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Pre-eclampsia">
  <rect width="640" height="340" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Pre-eclampsia</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Diagnostico - gravidade - resolucao</text>

  <rect x="32" y="92" width="576" height="64" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
  <text x="320" y="118" text-anchor="middle" fill="#ecfeff" font-family="Arial, sans-serif" font-size="14" font-weight="700">HAS &gt;= 140x90 apos 20 sem</text>
  <text x="320" y="140" text-anchor="middle" fill="#99f6e4" font-family="Arial, sans-serif" font-size="12">+ proteinuria  OU  disfuncao de orgao-alvo</text>

  <path d="M160 156 V178" stroke="#64748b" stroke-width="2"/>
  <path d="M480 156 V178" stroke="#64748b" stroke-width="2"/>
  <path d="M160 178 H480" stroke="#64748b" stroke-width="2"/>

  <rect x="32" y="190" width="270" height="100" rx="12" fill="#78350f" stroke="#fbbf24"/>
  <text x="167" y="222" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="14" font-weight="700">Sem gravidade</text>
  <text x="167" y="248" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="12">Controle PA + vigilancia</text>
  <text x="167" y="270" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12">Resolver conforme IG/clinica</text>

  <rect x="338" y="190" width="270" height="100" rx="12" fill="#7f1d1d" stroke="#f87171"/>
  <text x="473" y="222" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Com gravidade / eclampsia</text>
  <text x="473" y="248" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="12">MgSO4 + anti-HA + estabilizar</text>
  <text x="473" y="270" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">Planejar resolucao da gestacao</text>

  <text x="32" y="322" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Cura definitiva = parto no momento certo - toxicidade do Mg: gluconato de Ca</text>
</svg>
