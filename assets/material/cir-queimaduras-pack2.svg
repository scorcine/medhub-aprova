  <text x="76" y="198" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Face posterior do tronco = 18%</text>
  <circle cx="52" cy="228" r="12" fill="#134e4a" stroke="#2dd4bf"/>
