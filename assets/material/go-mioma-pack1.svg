<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" role="img">
  <rect width="640" height="342" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">FIGO mioma (ideia)</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Tipos 0-8 por localizacao</text>
  <rect x="32" y="78" width="576" height="192" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">0 - pediculado intracavitario</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">submuc</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">1 - &lt;50% intramural</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">submuc</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">2 - &gt;=50% intramural</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">submuc</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">3-5 - contato endometrio / intramural</text>
  <text x="580" y="172" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">intra</text>
  <text x="48" y="200" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">6-7 - subseroso (+/- pediculo)</text>
  <text x="580" y="200" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">subser</text>
  <text x="48" y="228" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">8 - cervical / parasita / outros</text>
  <text x="580" y="228" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">outro</text>
  <text x="32" y="284" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">0-2 submucosos | 3-5 intramurais | 6-7 subserosos | 8 outros</text>

</svg>
