<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img">
  <rect width="640" height="260" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Avaliacao primaria ATLS</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Ordem fixa do que mata primeiro</text>
  <line x1="40" y1="150" x2="600" y2="150" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="150" r="10" fill="#2dd4bf"/>
  <text x="60" y="110" text-anchor="middle" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="12" font-weight="700">A</text>
  <text x="60" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">via aerea + C-spine</text>
  <circle cx="190" cy="150" r="10" fill="#2dd4bf"/>
  <text x="190" y="110" text-anchor="middle" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="12" font-weight="700">B</text>
  <text x="190" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">ventilacao / torax</text>
  <circle cx="320" cy="150" r="10" fill="#fbbf24"/>
  <text x="320" y="110" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">C</text>
  <text x="320" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">circulacao / hemorragia</text>
  <circle cx="450" cy="150" r="10" fill="#f87171"/>
  <text x="450" y="110" text-anchor="middle" fill="#f87171" font-family="Arial, sans-serif" font-size="12" font-weight="700">D</text>
  <text x="450" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">neurologico (ECG/pupilas)</text>
  <circle cx="580" cy="150" r="10" fill="#a78bfa"/>
  <text x="580" y="110" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="12" font-weight="700">E</text>
  <text x="580" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">exposicao + aquecer</text>

</svg>
