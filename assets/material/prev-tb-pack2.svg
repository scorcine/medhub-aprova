  <text x="76" y="96" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">SR: tosse por &gt;= 2-3 semanas (ideia de prova/MS)</text>
  <circle cx="52" cy="126" r="12" fill="#134e4a" stroke="#2dd4bf"/>
