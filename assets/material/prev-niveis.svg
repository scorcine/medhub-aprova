<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Niveis de prevencao">
  <rect width="640" height="300" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Niveis de prevencao</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Historia natural da doenca (visao de prova)</text>

  <line x1="40" y1="150" x2="600" y2="150" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <circle cx="90" cy="150" r="10" fill="#2dd4bf"/>
  <circle cx="210" cy="150" r="10" fill="#2dd4bf"/>
  <circle cx="330" cy="150" r="10" fill="#fbbf24"/>
  <circle cx="450" cy="150" r="10" fill="#f87171"/>
  <circle cx="560" cy="150" r="10" fill="#a78bfa"/>

  <text x="90" y="110" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">Primordial</text>
  <text x="90" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">determinantes</text>

  <text x="210" y="110" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">Primaria</text>
  <text x="210" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">evitar doenca</text>

  <text x="330" y="110" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="12" font-weight="700">Secundaria</text>
  <text x="330" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">detectar cedo</text>

  <text x="450" y="110" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="12" font-weight="700">Terciaria</text>
  <text x="450" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">limitar dano</text>

  <text x="560" y="110" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="12" font-weight="700">Quaternaria</text>
  <text x="560" y="190" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">evitar excesso</text>

  <text x="32" y="250" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Vacina = primaria - Mamografia = secundaria - Reabilitacao = terciaria</text>
  <text x="32" y="274" fill="#64748b" font-family="Arial, sans-serif" font-size="12">MedHub R1 - material de apoio</text>
</svg>
