<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img">
  <rect width="640" height="370" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">BI-RADS (ideia)</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">0 a 6 - conduta mental</text>
  <rect x="32" y="78" width="576" height="220" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">0 - incompleto</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">mais imgs</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">1 - negativo</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">rotina</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">2 - benigno</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">rotina</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">3 - provavelmente benigno</text>
  <text x="580" y="172" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">6 meses</text>
  <text x="48" y="200" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">4 - suspeito</text>
  <text x="580" y="200" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">biopsia</text>
  <text x="48" y="228" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">5 - altamente sugestivo</text>
  <text x="580" y="228" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">biopsia</text>
  <text x="48" y="256" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">6 - ca conhecido</text>
  <text x="580" y="256" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">tratar</text>
  <text x="32" y="312" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">4-5 = biopsia | 3 = controle curto | 1-2 = rotina</text>

</svg>
