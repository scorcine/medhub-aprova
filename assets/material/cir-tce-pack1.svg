<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 454" role="img">
  <rect width="640" height="454" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Glasgow Coma Scale</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Olho + Verbal + Motor (3-15)</text>
  <rect x="32" y="78" width="576" height="304" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">O4 - espontanea</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">4</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">O3 - a voz | O2 - a dor | O1 - nenhuma</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">3-1</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">V5 - orientada</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">5</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">V4 - confusa | V3 - palavras | V2 - sons | V1 - 0</text>
  <text x="580" y="172" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">4-1</text>
  <text x="48" y="200" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">M6 - obedece comandos</text>
  <text x="580" y="200" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">6</text>
  <text x="48" y="228" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">M5 - localiza dor</text>
  <text x="580" y="228" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">5</text>
  <text x="48" y="256" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">M4 - flexao retirada</text>
  <text x="580" y="256" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">4</text>
  <text x="48" y="284" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">M3 - flexao anormal (decorticada)</text>
  <text x="580" y="284" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">3</text>
  <text x="48" y="312" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">M2 - extensao (descerebrada)</text>
  <text x="580" y="312" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">2</text>
  <text x="48" y="340" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">M1 - nenhuma resposta motora</text>
  <text x="580" y="340" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="32" y="396" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Leve 13-15 | Moderado 9-12 | Grave &lt;=8</text>

</svg>
