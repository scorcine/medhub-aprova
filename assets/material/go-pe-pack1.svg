<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 374" role="img">
  <rect width="640" height="374" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">PE - criterios de gravidade</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">PA alta + disfuncao de orgao-alvo</text>
  <circle cx="52" cy="92" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="96" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="76" y="96" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">PA &gt;= 160 x 110 mmHg</text>
  <circle cx="52" cy="126" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="130" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="76" y="130" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Plaquetas &lt; 100.000</text>
  <circle cx="52" cy="160" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="164" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="76" y="164" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">TGO/TGP elevadas (2x)</text>
  <circle cx="52" cy="194" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="198" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="76" y="198" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Creatinina elevada / oliguria</text>
  <circle cx="52" cy="228" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="232" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">5</text>
  <text x="76" y="232" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Edema pulmonar</text>
  <circle cx="52" cy="262" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="266" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">6</text>
  <text x="76" y="266" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Cefaleia / escotomas / epigastralgia</text>
  <circle cx="52" cy="296" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="300" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">7</text>
  <text x="76" y="300" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Restricao / sofrimento fetal</text>
  <text x="32" y="350" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Qualquer 1 criterio = PE com gravidade</text>

