<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img">
  <rect width="640" height="300" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Escala do evento</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Surto -&gt; epidemia -&gt; pandemia</text>
  <rect x="32" y="90" width="180" height="170" rx="14" fill="#14532d" stroke="#4ade80"/>
  <text x="122" y="120" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Surto</text>
  <text x="122" y="150" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Localizado</text>
  <text x="122" y="170" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Escola/hospital</text>
  <text x="122" y="190" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Resposta rapida</text>
  <text x="122" y="230" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="12" font-weight="700">Foco</text>
  <rect x="232" y="90" width="180" height="170" rx="14" fill="#78350f" stroke="#fbbf24"/>
  <text x="322" y="120" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Epidemia</text>
  <text x="322" y="150" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">&gt; esperado</text>
  <text x="322" y="170" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Comunidade/regiao</text>
  <text x="322" y="190" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Curva epidemica</text>
  <text x="322" y="230" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="12" font-weight="700">Excesso</text>
  <rect x="432" y="90" width="180" height="170" rx="14" fill="#7f1d1d" stroke="#f87171"/>
  <text x="522" y="120" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Pandemia</text>
  <text x="522" y="150" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Multiplos paises</text>
  <text x="522" y="170" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Transmissao sustentada</text>
  <text x="522" y="190" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Impacto global</text>
  <text x="522" y="230" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="700">Global</text>

</svg>
