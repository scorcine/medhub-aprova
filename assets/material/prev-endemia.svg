<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img">
  <rect width="640" height="310" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Ocorrencia de agravos</text>
  <rect x="32" y="88" width="576" height="50" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
  <text x="320" y="118" text-anchor="middle" fill="#ecfeff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Esperado (endemia) vs excesso (surto/epidemia)</text>
  <path d="M160 138 V160" stroke="#64748b" stroke-width="2"/>
  <path d="M480 138 V160" stroke="#64748b" stroke-width="2"/>
  <path d="M160 160 H480" stroke="#64748b" stroke-width="2"/>
  <rect x="32" y="160" width="270" height="110" rx="12" fill="#78350f" stroke="#fbbf24"/>
  <text x="167" y="188" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="13" font-weight="700">Dentro do esperado</text>
  <text x="167" y="200" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="11">Endemia</text>
  <text x="167" y="220" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="11">Incidencia habitual</text>
  <text x="167" y="240" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="11">Pode ter sazonalidade</text>
  <rect x="338" y="160" width="270" height="110" rx="12" fill="#7f1d1d" stroke="#f87171"/>
  <text x="473" y="188" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="13" font-weight="700">Acima do esperado</text>
  <text x="473" y="200" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Surto / epidemia</text>
  <text x="473" y="220" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Excesso no tempo-lugar</text>
  <text x="473" y="240" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Pandemia se global</text>

</svg>
