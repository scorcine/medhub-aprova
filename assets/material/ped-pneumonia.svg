<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img">
  <rect width="640" height="300" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">PAC pediatrica - gravidade</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Ambulatorial / enfermaria / UTI</text>
  <rect x="32" y="90" width="180" height="170" rx="14" fill="#14532d" stroke="#4ade80"/>
  <text x="122" y="120" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Ambulatorial</text>
  <text x="122" y="150" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Bom estado geral</text>
  <text x="122" y="170" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">SatO2 adequada</text>
  <text x="122" y="190" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="11">Aceita VO / ATB VO</text>
  <text x="122" y="230" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="12" font-weight="700">Retorno precoce</text>
  <rect x="232" y="90" width="180" height="170" rx="14" fill="#78350f" stroke="#fbbf24"/>
  <text x="322" y="120" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Enfermaria</text>
  <text x="322" y="150" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Tiragem / taquipneia</text>
  <text x="322" y="170" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">SatO2 baixa</text>
  <text x="322" y="190" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">ATB EV +/- O2</text>
