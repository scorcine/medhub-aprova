  <rect x="432" y="90" width="180" height="170" rx="14" fill="#7f1d1d" stroke="#f87171"/>
  <text x="522" y="120" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">UTI</text>
