  <text x="522" y="190" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="11">Choque / falha ventilatoria</text>
  <text x="522" y="230" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12" font-weight="700">Suporte avancado</text>

