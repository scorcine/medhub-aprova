<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img">
  <rect width="640" height="370" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">TIMI UA/NSTEMI (7 itens)</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">1 ponto cada; risco 0-7</text>
  <rect x="32" y="78" width="576" height="220" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Idade &gt;= 65 anos</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">&gt;= 3 FRs coronarianos</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Estenose coronaria conhecida &gt;= 50%</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">AAS nos ultimos 7 dias</text>
  <text x="580" y="172" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="48" y="200" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Angina severa recente (&gt;= 2 episodios/24h)</text>
  <text x="580" y="200" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="48" y="228" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Desvio ST &gt;= 0,5 mm</text>
  <text x="580" y="228" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="48" y="256" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Troponina/CK-MB elevada</text>
  <text x="580" y="256" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="32" y="312" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">0-2 baixo | 3-4 intermediario | 5-7 alto</text>

