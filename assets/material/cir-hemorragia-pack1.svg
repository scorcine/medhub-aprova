  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Classificacao endoscopica</text>
  <rect x="32" y="78" width="576" height="192" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Ia - sangramento jato arterial</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">Alto</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Ib - sangramento babando</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">Alto</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">IIa - vaso visivel nao sangrante</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">Alto</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">IIb - coagulo aderido</text>
