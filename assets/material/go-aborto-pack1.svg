<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" role="img">
  <rect width="640" height="342" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Tipos de abortamento</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Colo / restos / clinica</text>
  <rect x="32" y="78" width="576" height="192" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Ameaca - colo fechado, utero viavel</text>
  <text x="580" y="88" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">repouso</text>
  <text x="48" y="116" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Inevitavel - colo dilatado, sangramento</text>
  <text x="580" y="116" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">esvaziar</text>
  <text x="48" y="144" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Incompleto - restos + colo aberto</text>
  <text x="580" y="144" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">curetagem</text>
  <text x="48" y="172" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Completo - esvaziado, colo fecha</text>
  <text x="580" y="172" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">observar</text>
  <text x="48" y="200" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Retido - ovo morto, colo fechado</text>
  <text x="580" y="200" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">esvaziar</text>
  <text x="48" y="228" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Infectado - febre + restos/colo</text>
  <text x="580" y="228" text-anchor="end" fill="#5eead4" font-family="Arial, sans-serif" font-size="13" font-weight="700">ATB+esvaz</text>
  <text x="32" y="284" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Colo fechado + vitalidade = ameaca</text>

</svg>
