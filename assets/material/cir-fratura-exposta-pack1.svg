  <text x="32" y="256" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">I limpa &lt;1cm | II &gt;1cm moderada | IIIA cobertura | IIIB precisa retalho | IIIC arterial</text>

