<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img">
  <rect width="640" height="272" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Criterios classificatorios (ideia EULAR/ACR)</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Entrada: FAN &gt;= 1:80</text>
  <circle cx="52" cy="92" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="96" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="76" y="96" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Entrada: FAN positivo</text>
  <circle cx="52" cy="126" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="130" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="76" y="130" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Dominios clinicos (pele, artic, renal, neuro, serosite...)</text>
  <circle cx="52" cy="160" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="164" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="76" y="164" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Dominios imunologicos (DNA, Sm, AAF, C3/C4)</text>
  <circle cx="52" cy="194" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="198" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="76" y="198" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Somar pontos &gt;= limiar classificatorio</text>
  <text x="32" y="248" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Prova ainda cita criterios ACR antigos (malar, discoide, fotossens., ulcera, artrite...)</text>

</svg>
