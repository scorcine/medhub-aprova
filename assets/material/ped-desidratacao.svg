<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Desidratacao pediatrica">
  <rect width="640" height="320" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Desidratacao pediatrica</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Classifique pela clinica - prefira TRO quando possivel</text>

  <rect x="32" y="96" width="180" height="150" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="122" y="130" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="15" font-weight="700">Leve</text>
  <text x="122" y="158" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="12">Alerta - mucosa umida</text>
  <text x="122" y="180" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="12">Turgor normal</text>
  <text x="122" y="214" text-anchor="middle" fill="#86efac" font-family="Arial, sans-serif" font-size="13" font-weight="700">Plano A / TRO</text>

  <rect x="230" y="96" width="180" height="150" rx="14" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="15" font-weight="700">Moderada</text>
  <text x="320" y="158" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12">Irritado - olhos fundos</text>
  <text x="320" y="180" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12">Turgor baixo - diurese baixa</text>
  <text x="320" y="214" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="13" font-weight="700">Plano B - TRO</text>

  <rect x="428" y="96" width="180" height="150" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="518" y="130" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="15" font-weight="700">Grave</text>
  <text x="518" y="158" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="12">Letargia / choque</text>
  <text x="518" y="180" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="12">Prega / oliguria</text>
  <text x="518" y="214" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="13" font-weight="700">Plano C - EV</text>

  <text x="32" y="290" fill="#64748b" font-family="Arial, sans-serif" font-size="12">SRO em pequenos volumes - manter aleitamento - EV se choque ou falha da TRO</text>
</svg>
