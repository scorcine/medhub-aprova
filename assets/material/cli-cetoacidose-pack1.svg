<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" role="img">
  <rect width="640" height="272" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Criterios laboratoriais CAD</text>
  <text x="32" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Triade classica</text>
  <circle cx="52" cy="92" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="96" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="76" y="96" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Glicose tipicamente &gt; 250 mg/dL</text>
  <circle cx="52" cy="126" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="130" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="76" y="130" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">pH &lt; 7,3 ou HCO3 &lt; 18</text>
  <circle cx="52" cy="160" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="164" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="76" y="164" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Cetona positiva (sangue/urina)</text>
  <circle cx="52" cy="194" r="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="52" y="198" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="76" y="198" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Anion gap elevado</text>
  <text x="32" y="248" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700">Variantes: euglicemica (SGLT2) — cetoacidose com glicose perto do normal</text>

</svg>
